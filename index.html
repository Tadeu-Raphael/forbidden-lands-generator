<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17251f">
    <meta name="description" content="Escolha um gerador de aldeias, masmorras ou castelos para Forbidden Lands.">
    <title data-i18n="Forbidden Lands Generator">Forbidden Lands Generator</title>
    <link rel="stylesheet" href="css/stylesheet.css">
</head>
<body class="index-page" data-page="index">
    <div class="site-shell">
        <div id="site-header"></div>

        <main class="index-main">
            <section class="main-menu" id="opcoes" aria-labelledby="menu-title">
                <h1 class="menu-title" id="menu-title"><span aria-hidden="true">🌲</span> <span data-i18n="Forbidden Lands Generator">Forbidden Lands Generator</span></h1>
                <p class="menu-description" data-i18n="Choose what to create for your adventure:">Escolha o que deseja criar para sua aventura:</p>

                <div class="generator-options">
                    <a class="city-card village-card" data-route="village">
                        <h2 class="city-title">🌲 <span data-i18n="Village">Aldeia</span></h2>
                        <p class="city-description" data-i18n="Create a remote settlement and its inhabitants.">Crie um assentamento isolado e seus habitantes.</p>
                    </a>
                    <a class="city-card dungeon-card" data-route="dungeon">
                        <h2 class="city-title">🕳️ <span data-i18n="Dungeon">Masmorra</span></h2>
                        <p class="city-description" data-i18n="Explore ancient ruins, dangers, and forgotten treasures.">Explore ruínas antigas, perigos e tesouros esquecidos.</p>
                    </a>
                    <a class="city-card castle-card" data-route="castle">
                        <h2 class="city-title">🏰 <span data-i18n="Castle">Castelo</span></h2>
                        <p class="city-description" data-i18n="Create a stronghold, its defenses, and secrets.">Crie uma fortaleza, suas defesas e seus segredos.</p>
                    </a>
                </div>
            </section>
        </main>

        <div id="site-footer"></div>
    </div>
    <script src="js/layout.js" defer></script>
</body>
</html>
